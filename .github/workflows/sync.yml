# Scheduled upstream sync, mirroring Cargo's branches.
#
#   nightly -> main              (branch sync/main, auto-merge when CI passes)
#   stable  -> rust-1.XX.0       (release pull request, merged by a human)
#
# `sync.py plan` resolves nightly through the dated release manifest a day
# behind, and stable through the manifest of the current release. A release
# branch is cut the first time a release resolves onto Cargo's branch of that
# name. Runs daily, and by hand from the Actions tab when a release lands
# mid-day. CONTRIBUTING.md has the variables, secrets and branch rules this
# expects.
name: Sync

on:
  schedule:
    # Nightlies land around 01:00 UTC; with a one day lag the manifest this
    # run uses has existed for over a day.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      channels:
        description: Which channels to sync (comma-separated subset of nightly, stable, beta)
        type: string
        default: nightly,stable
      lag:
        description: Days behind today for nightly (empty = SYNC_LAG_DAYS or 1)
        type: string
        default: ""
      open_pr:
        description: Open or update a pull request with the result
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

# Never let two syncs race on the same branches.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lag: ${{ steps.plan.outputs.lag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve channels
        id: plan
        env:
          CHANNELS: ${{ inputs.channels || 'nightly,stable' }}
          LAG: ${{ inputs.lag || vars.SYNC_LAG_DAYS || '1' }}
        run: |
          set -euo pipefail
          python3 sync/sync.py plan --channels "$CHANNELS" --lag "$LAG" > "$RUNNER_TEMP/plan.json"
          echo "lag=$LAG" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/plan.json" <<'PY'
          import json, os, sys
          plan = json.load(open(sys.argv[1]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(plan) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| channel | branch | target | cargo commit |\n|---|---|---|---|\n")
              for e in plan:
                  summary.write(f"| {e['channel']} | `{e['base']}` | `{e['target']}` | `{e['commit']}` |\n")
          PY

  sync:
    name: ${{ matrix.channel }} -> ${{ matrix.base }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_sync-channel.yml
    with:
      channel: ${{ matrix.channel }}
      base: ${{ matrix.base }}
      target: ${{ matrix.target }}
      open_pr: ${{ github.event_name != 'workflow_dispatch' || inputs.open_pr }}
    secrets: inherit
